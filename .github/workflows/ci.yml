name: Construction Management CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    name: Backend Build and Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Backend Tests
        run: ./mvnw test

      - name: Build Spring Boot Application
        run: ./mvnw clean package -DskipTests


  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: construction-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: construction-frontend
        run: npm ci

      - name: Build React Application
        working-directory: construction-frontend
        run: npm run build


  # ==========================================
  # DOCKER
  # ==========================================

  docker:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t construction-backend .

      - name: Build Frontend Docker Image
        run: docker build -t construction-frontend ./construction-frontend