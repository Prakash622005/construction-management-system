name: Construction Management CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # BACKEND BUILD AND TEST
  # ============================================================

  backend:
    name: Backend Build and Test

    runs-on: ubuntu-latest

    # ------------------------------------------------------------
    # MySQL service for Spring Boot tests
    # ------------------------------------------------------------

    services:

      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: construction_management_db

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    # ------------------------------------------------------------
    # Environment variables used by Spring Boot
    # ------------------------------------------------------------

    env:

      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/construction_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root

      JWT_SECRET: constructionmanagementsystemjwtsecretkey2026constructionmanagementsystemjwtsecretkey2026


    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Java 21
      # ----------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # ----------------------------------------------------------
      # Maven Wrapper permission
      # ----------------------------------------------------------

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw


      # ----------------------------------------------------------
      # Backend Tests
      # ----------------------------------------------------------

      - name: Run Backend Tests
        run: ./mvnw test


      # ----------------------------------------------------------
      # Build Spring Boot Application
      # ----------------------------------------------------------

      - name: Build Spring Boot Application
        run: ./mvnw clean package -DskipTests



  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Node.js 22
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: construction-frontend/package-lock.json


      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------

      - name: Install Frontend Dependencies
        working-directory: construction-frontend
        run: npm ci


      # ----------------------------------------------------------
      # Build React Application
      # ----------------------------------------------------------

      - name: Build React Application
        working-directory: construction-frontend
        run: npm run build



  # ============================================================
  # DOCKER BUILD
  # ============================================================

  docker:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Build Backend Docker Image
      # ----------------------------------------------------------

      - name: Build Backend Docker Image
        run: docker build -t construction-backend .


      # ----------------------------------------------------------
      # Build Frontend Docker Image
      # ----------------------------------------------------------

      - name: Build Frontend Docker Image
        run: docker build -t construction-frontend ./construction-frontend